version: 2
updates:
  - package-ecosystem: maven
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    ignore:
      # TAR-278: el appender queda en la versión construida sobre el SDK de OpenTelemetry que trae
      # el BOM de Spring Boot. Uno más nuevo arrastra un api-incubator sin ExtendedAttributes y la
      # exportación de logs muere (#134, #141). Se sube a mano junto con el SDK del BOM.
      - dependency-name: io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0
  - package-ecosystem: docker
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    ignore:
      # El JDK (25, LTS) lo fija java.version del pom; el job docker-build de CI exige que la imagen
      # de compilación, el runtime y el pom coincidan. Aquí se ignoran los saltos de versión mayor
      # (por ejemplo a un JDK no LTS); las actualizaciones menores y de parche siguen permitidas.
      - dependency-name: maven
        update-types: ["version-update:semver-major"]
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
