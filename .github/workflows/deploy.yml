name: deploy
# Despliegue de development al entorno de desarrollo por pipeline (TAR-72), independiente del
# proveedor: el workflow solo llama a .github/deploy/deploy.sh. No se activa hasta que existe la
# variable DEPLOY_PROVIDER del repositorio.
on:
  push:
    branches: [development]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit completo a desplegar (vacío: el último de development). Sirve de reversión.'
        required: false
permissions:
  contents: read
concurrency:
  group: deploy-development
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ vars.DEPLOY_PROVIDER != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Secretos y variables del proveedor viven solo en este entorno.
    environment: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Desplegar
        env:
          DEPLOY_PROVIDER: ${{ vars.DEPLOY_PROVIDER }}
          COMMIT_SHA: ${{ inputs.ref || github.sha }}
          HEALTH_URL: ${{ vars.HEALTH_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: bash .github/deploy/deploy.sh
