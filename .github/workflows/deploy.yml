name: deploy
# Despliegue por pipeline (TAR-72, TAR-302), independiente del proveedor: el workflow solo llama a
# .github/deploy/deploy.sh. development despliega al entorno de GitHub "development" y main al
# entorno "production", que exige un revisor. No se activa hasta que existe la variable de
# REPOSITORIO DEPLOY_PROVIDER (las variables de un entorno no existen todavía cuando se evalúa el
# if del job).
on:
  push:
    branches: [development, main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit completo a desplegar (vacío: el último de la rama desde la que se lanza). Debe ser un ancestro de esa rama (development o main); sirve de reversión.'
        required: false
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  deploy:
    # Solo se ejecuta desde development o main: los scripts que reciben los secretos salen siempre de
    # una rama protegida, y el commit pedido llega como dato.
    if: ${{ vars.DEPLOY_PROVIDER != '' && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Secretos y variables del proveedor viven solo en el entorno de cada rama; production exige
    # aprobación (ADR-O03, decisión 3) y solo admite la rama main.
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Comprobar el commit pedido
        env:
          REQUESTED: ${{ inputs.ref }}
        run: |
          set -eu
          commit="${REQUESTED:-$(git rev-parse HEAD)}"
          if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "El commit debe ser un hash completo de 40 caracteres"; exit 1
          fi
          if ! git merge-base --is-ancestor "$commit" HEAD; then
            echo "El commit $commit no pertenece a ${GITHUB_REF_NAME}"; exit 1
          fi
          echo "COMMIT_SHA=$commit" >> "$GITHUB_ENV"
        shell: bash
      - name: Desplegar
        env:
          DEPLOY_PROVIDER: ${{ vars.DEPLOY_PROVIDER }}
          HEALTH_URL: ${{ vars.HEALTH_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: bash .github/deploy/deploy.sh
