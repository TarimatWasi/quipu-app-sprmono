name: ci
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - run: mvn -B verify
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
  migrations-immutable:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          if git diff --name-status --diff-filter=MDR "origin/$BASE_REF"...HEAD -- src/main/resources/db/migration | grep -q .; then
            echo "Una migración existente fue modificada, renombrada o borrada (BE-SPR-DAT-05)"; exit 1
          fi
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: JDK alineado entre imagen de compilación, runtime y pom
        run: |
          set -eu
          build=$(sed -nE 's/^FROM maven:[^ @]*-temurin-([0-9]+).*/\1/p' Dockerfile)
          runtime=$(sed -nE 's/^FROM eclipse-temurin:([0-9]+).*/\1/p' Dockerfile)
          pom=$(sed -nE 's#.*<java.version>([0-9]+)</java.version>.*#\1#p' pom.xml)
          echo "JDK: compilación=$build runtime=$runtime pom=$pom"
          if [ -z "$build" ] || [ "$build" != "$runtime" ] || [ "$runtime" != "$pom" ]; then
            echo "El JDK de la imagen de compilación, el del runtime y java.version del pom deben coincidir"; exit 1
          fi
      - name: Construir la imagen
        run: docker build -t quipu-api:ci .
      - name: Arrancar con el perfil dev y 512 MB (límite de Render gratis)
        run: |
          set -eu
          docker network create quipu-ci
          pgpass=$(openssl rand -hex 8)
          jwt=$(openssl rand -base64 48 | tr -d '\n=')
          echo "::add-mask::$pgpass"; echo "::add-mask::$jwt"
          docker run -d --name pg --network quipu-ci \
            -e "POSTGRES_PASSWORD=$pgpass" -e POSTGRES_USER=quipu -e POSTGRES_DB=quipu \
            postgres:17 >/dev/null
          for i in $(seq 1 30); do docker exec pg pg_isready -U quipu -d quipu >/dev/null 2>&1 && break; sleep 1; done
          docker exec pg pg_isready -U quipu -d quipu
          docker run -d --name api --network quipu-ci --memory 512m -p 10000:10000 \
            -e SPRING_PROFILES_ACTIVE=dev -e PORT=10000 \
            -e "DATABASE_URL=jdbc:postgresql://pg:5432/quipu?user=quipu&password=$pgpass" \
            -e "JWT_SECRET=$jwt" -e CORS_ALLOWED_ORIGIN=https://example.vercel.app \
            -e ADMIN_DOCUMENT_NUMBER=12345678 -e ADMIN_EMAIL=ci@example.test \
            -e R2_ACCOUNT_ID=ci -e R2_ACCESS_KEY_ID=ci -e R2_SECRET_ACCESS_KEY=ci-dummy \
            -e R2_ENDPOINT=https://example.invalid -e R2_BUCKET_NAME=ci \
            -e RESEND_API_KEY=ci-dummy -e RESEND_FROM_EMAIL=ci@example.test \
            -e OTEL_EXPORTER_OTLP_ENDPOINT=https://example.invalid/otlp \
            -e MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED=false \
            -e MANAGEMENT_LOGGING_EXPORT_OTLP_ENABLED=false \
            quipu-api:ci >/dev/null
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:10000/actuator/health 2>/dev/null | grep -q '"status":"UP"'; then
              echo "health UP tras ~$((i * 2)) s"
              [ "$(docker inspect -f '{{.State.OOMKilled}}' api)" = "false" ]
              exit 0
            fi
            [ "$(docker inspect -f '{{.State.Running}}' api)" = "true" ] || { echo "El contenedor se detuvo"; exit 1; }
            sleep 2
          done
          echo "El servicio no llegó a UP en 120 s"; exit 1
      - name: Logs del contenedor (solo si falla)
        if: failure()
        run: docker logs --tail 200 api || true
      - name: Limpieza
        if: always()
        run: |
          docker rm -f api pg 2>/dev/null || true
          docker network rm quipu-ci 2>/dev/null || true
