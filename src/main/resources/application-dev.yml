# Perfil dev (SPRING_PROFILES_ACTIVE=dev, despliegue desde la rama development): estricto como
# prod. Sin defaults: si falta una variable, el arranque falla (BE-SPR-CFG-05). Diferencias con
# prod: documentación de la API encendida y log de la aplicación en DEBUG.
server:
  port: ${PORT}
  forward-headers-strategy: native # el proxy termina TLS; respeta X-Forwarded-*

spring:
  datasource:
    url: ${DATABASE_URL}

app:
  rate-limit:
    client-ip-header: CF-Connecting-IP # TAR-124: Render va detrás de Cloudflare; getRemoteAddr() es un borde que cambia
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN} # origin exacto del frontend, https, sin "/" final
    # La reescritura de Vercel (/bff) conserva el Origin del host de Vercel (TAR-75): se listan el
    # segundo alias de producción y, con comodín solo dentro de la primera etiqueta, los alias de
    # rama y los despliegues por hash del proyecto. Cualquier otro origen recibe 403. Un patrón
    # ligado al equipo no distingue un host del equipo de una etiqueta parecida que termine igual:
    # Vercel asigna las etiquetas y la cookie de sesión vive en el dominio de Vercel.
    allowed-origins:
      - https://quipu-app-angweb-dev-shizukajikus-projects.vercel.app
      # Dominio propio del frontend de desarrollo (TAR-128). El de producción
      # (quipu.tarimatwasi.com) no se lista aquí: es de application-prod.yml.
      - https://quipu-dev.tarimatwasi.com
    # El comodín casa [a-z0-9-]+ (nunca un punto) y cubre los alias de rama
    # (quipu-app-angweb-dev-git-<rama>-...) y los despliegues por hash; un solo patrón.
    allowed-origin-patterns:
      - https://quipu-app-angweb-*-shizukajikus-projects.vercel.app
  # Primer ADMIN (AdminBootstrap): solo se crea si no existe ninguno. Son las únicas variables
  # opcionales con valor vacío por defecto: una vez creado el ADMIN ya no hacen falta.
  admin:
    required: true # sin ADMIN y sin ADMIN_DOCUMENT_NUMBER / ADMIN_EMAIL el arranque falla
    document-number: ${ADMIN_DOCUMENT_NUMBER:}
    email: ${ADMIN_EMAIL:}
  r2:
    account-id: ${R2_ACCOUNT_ID}
    access-key-id: ${R2_ACCESS_KEY_ID}
    secret-access-key: ${R2_SECRET_ACCESS_KEY}
    endpoint: ${R2_ENDPOINT}
    bucket-name: ${R2_BUCKET_NAME}
  resend:
    api-key: ${RESEND_API_KEY}
    from-email: ${RESEND_FROM_EMAIL}

# Métricas y logs por push a Grafana Cloud (ADR-F5, TAR-139). Spring Boot lee
# OTEL_EXPORTER_OTLP_HEADERS solo (spring-boot-opentelemetry); la del endpoint es obligatoria como el
# resto. Los logs por debajo de INFO no salen (logback-spring.xml).
management:
  otlp:
    metrics:
      export:
        enabled: true
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/metrics
  logging:
    export:
      otlp:
        enabled: true
  opentelemetry:
    resource-attributes:
      deployment.environment: dev
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/logs

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    root: INFO
    com.tarimatwasi: DEBUG
