# Configuración común a todos los perfiles, sin valores sensibles ni por defecto (BE-SPR-CFG-05).
# Perfiles: local (por defecto, máquina del desarrollador), dev (despliegue desde la rama
# development) y prod (despliegue desde main). Lo que difiere vive en application-<perfil>.yml.
spring:
  application:
    name: quipu
  # Sin SPRING_PROFILES_ACTIVE (desarrollo y pruebas) corre "local"; dev y prod se activan
  # explícitamente en el despliegue.
  profiles:
    default: local
  # TAR-204: una conexión de la aplicación espera un bloqueo de fila 15 s como mucho; al vencer,
  # Postgres corta la sentencia (55P03) y el BFF responde CONCURRENT_MODIFICATION, sin 500. Es más
  # que app.r2.api-call-timeout (10 s): quien sube a R2 con filas bloqueadas termina antes de que
  # venza la espera de otro. Las migraciones esperan hasta 60 s (spring.flyway.init-sqls,
  # FlywayConfig).
  datasource:
    hikari:
      connection-init-sql: SET lock_timeout = '15s'
      # TAR-206: un pool acotado y una espera corta por conexión: con el pool agotado, la petición
      # falla a los 5 s en vez de quedarse colgada. Ningún perfil los cambia.
      maximum-pool-size: 10
      connection-timeout: 5000 # ms: HikariConfig la enlaza como número, no como Duration
      # TAR-277: sin conexiones ociosas fijas. Una conexión sin uso se cierra al minuto (antes del
      # keepalive de Hikari, 2 min), así Neon apaga el cómputo sin tráfico (scale-to-zero) y el plan
      # gratuito no se agota con el cómputo encendido todo el mes.
      minimum-idle: 0
      idle-timeout: 60000 # ms
      # TAR-207: el driver deja fuera de sus mensajes el detalle del servidor (la clave repetida o
      # la fila que falla, datos personales), así que ningún log de un error lo lleva; el nombre de
      # la restricción sigue en ServerErrorMessage. Va al driver con cualquier URL (también la de
      # DATABASE_URL) y ningún perfil lo cambia.
      data-source-properties:
        logServerErrorDetail: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    init-sqls: SET lock_timeout = '60s'
  mvc:
    problemdetails:
      enabled: true
  # El contrato pide números JSON y booleanos JSON: "10" o "true" entre comillas no se convierten.
  jackson:
    mapper:
      allow-coercion-of-scalars: false
  # Hilos virtuales (Java 25, ADR-F4): el applicationTaskExecutor de Boot pasa a ser un
  # SimpleAsyncTaskExecutor de hilos virtuales, que ignora spring.task.execution.pool.*. Su límite
  # y la espera al apagar se fijan abajo. El ejecutor es compartido: lo usa el correo de recuperación
  # (@Async) y cualquier otro @Async de adapter.out que se agregue.
  threads:
    virtual:
      enabled: true
  task:
    execution:
      simple:
        concurrency-limit: 10
        reject-tasks-when-limit-reached: true
      shutdown:
        await-termination: true
        await-termination-period: 8s
  web:
    error:
      include-message: never
      include-stacktrace: never
      include-binding-errors: never
      include-exception: false

# Sesión (TAR-62 PR3: pasa a @ConfigurationProperties con Duration de 30 días). El secreto viene
# siempre del entorno: sin valor por defecto en ningún perfil.
app:
  jwt:
    secret: ${JWT_SECRET}
    # TAR-228: el access token dura 15 minutos; la sesión se renueva con el refresh token.
    expiration: 15m
  # TAR-228: refresh token con rotación. Vence a los 7 días sin uso y nunca pasa de 30 días desde el
  # login; uno rotado hace menos de 30 s es una carrera de pestañas, no una reutilización.
  refresh:
    idle: 7d
    absolute: 30d
    reuse-grace: 30s
  # Clave que enmascara los ids que muestra el BFF (TAR-163). Siempre del entorno, sin valor por
  # defecto: cambiarla cambia todos los ids que ven los clientes.
  id-mask:
    key: ${ID_MASK_KEY}
  # Límite de peticiones en login y recuperación de contraseña (SEC-01, TAR-31 y TAR-124).
  # per-minute es por dirección y es holgado a propósito: detrás de Vercel todos los navegadores
  # comparten una sola dirección. per-account-per-minute cuenta los intentos de login por documento,
  # venga de donde venga. client-ip-header: solo si la capa de delante sobrescribe ese encabezado con
  # la IP real del cliente (dev y prod: CF-Connecting-IP, que Cloudflare escribe y el cliente no puede
  # enviar).
  # uploads-per-minute (TAR-206) cuenta las subidas de archivo por usuario de la sesión, en las seis
  # rutas que reciben archivo; es independiente del límite por dirección y vale como mucho 60.
  # upload-burst: subidas seguidas antes de que la recarga por minuto las espacie. Además, cada
  # usuario tiene una sola subida en curso.
  # administrator-creations-per-minute (RF-22): altas de administrador por usuario de la sesión, de 1
  # a 60. administrator-status-changes-per-minute (TAR-127): lo mismo para desactivar y para
  # reactivar un administrador, cada ruta con su propio contador, de 1 a 60.
  rate-limit:
    per-minute: 60
    per-account-per-minute: 10
    uploads-per-minute: 10
    upload-burst: 3
    administrator-creations-per-minute: 3
    administrator-status-changes-per-minute: 3
    # TAR-229: cambios del correo de cuenta de un huésped por usuario de la sesión y minuto, de 1 a
    # 60 (cada cambio puede escribir al correo anterior).
    guest-account-email-changes-per-minute: 5
    # TAR-127 (A0.6): cambios de la contraseña propia por usuario de la sesión y minuto, de 1 a 60
    # (cada intento compara la contraseña actual).
    password-changes-per-minute: 5
    # TAR-221: todas las peticiones a /bff/admin/** por usuario de sesión y minuto (de 1 a 600);
    # las subidas y las altas, bajas y reactivaciones de administrador cuentan aquí y además en su
    # límite propio.
    admin-requests-per-minute: 120
    # TAR-222: ediciones del perfil propio (PATCH /bff/guest/profile y /bff/temporary-guest/profile,
    # un solo contador) por usuario de sesión y minuto, de 1 a 60.
    profile-updates-per-minute: 10
  # RF-22: como máximo tantos administradores; cuenta las cuentas ADMIN que no están inactivas.
  administrators:
    max: 5
  # Cookie de sesión (TAR-75): el navegador habla con el origen del frontend y el alojamiento
  # reescribe /bff hacia este backend, así que la cookie es del mismo sitio: SameSite=Lax. Max-Age
  # coincide con la vigencia del token. Con el frontend en otro dominio: same-site: none.
  session:
    same-site: lax
    max-age: ${app.jwt.expiration}
  # Consentimiento de datos personales del onboarding (RF-14, TAR-137): versión vigente; su texto es
  # el recurso consent/<versión>.txt. Texto definitivo aprobado por el abogado (D-62, TAR-168). Una
  # versión nueva llega como archivo nuevo y las anteriores se retiran (TAR-305). 2026-11
  # (TAR-246): las fotos del documento también las ve el propio huésped; el abogado la aprobó el
  # 2026-11-07.
  consent:
    version: 2026-11

management:
  endpoints:
    web:
      exposure:
        include: health
  # Métricas y logs por push (ADR-F5, QP-SPRMONO-OBS-02): apagados salvo en dev y prod.
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false

# Documentación de la API (QP-SPRMONO-CTR-01): apagada salvo en local y dev.
springdoc:
  api-docs:
    enabled: false
    path: /api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

# TAR-39: PDFBox logs tokens of the files it parses; uploads must not reach the logs.
# TAR-281: Hibernate registra en INFO (HHH10001005) la URL JDBC con la contraseña en la query.
# BE-SPR-OBS-06.
logging:
  level:
    org.apache.pdfbox: OFF
    org.hibernate.orm.connections.pooling: WARN
