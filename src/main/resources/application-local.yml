# Perfil local (por defecto): máquina del desarrollador. Es autónomo: apunta a servicios en
# localhost y NO lee variables de entorno (TAR-69). La máquina de quien desarrolla puede tener
# credenciales reales de Neon, R2 o Resend en su entorno; este perfil no puede usarlas ni
# filtrarlas. ProfileFilesContractTest falla si aparece un ${...} que no sea random.uuid.
# dev y prod son estrictos y sí leen su configuración del entorno.
server:
  port: 8080

spring:
  datasource:
    # Postgres local sin contraseña (trust):
    #   docker run -d --name quipu-pg -p 5432:5432 -e POSTGRES_HOST_AUTH_METHOD=trust \
    #     -e POSTGRES_USER=quipu -e POSTGRES_DB=quipu postgres:17
    url: jdbc:postgresql://localhost:5432/quipu
    username: quipu

app:
  cors:
    allowed-origin: http://localhost:4200
  jwt:
    # Aleatorio en cada arranque: ningún secreto entra al repositorio público y las sesiones
    # locales se reinician con la aplicación.
    secret: ${random.uuid}${random.uuid}
  # Igual que el secreto de sesión: aleatoria en cada arranque, los ids enmascarados cambian al reiniciar.
  id-mask:
    key: ${random.uuid}${random.uuid}
  # Sin ADMIN en local: no hay contraseña inicial que versionar (ver la prueba del perfil).
  admin:
    document-number: "00000000" # el enlace para elegir la contraseña sale en la consola del arranque
    email: "admin@quipu.local"
  # Servicios externos sin credenciales: los diagnósticos reportan FAIL en vez de tumbar el
  # arranque.
  r2:
    account-id: ""
    access-key-id: ""
    secret-access-key: ""
    endpoint: ""
    bucket-name: ""
  resend:
    api-key: ""
    from-email: onboarding@resend.dev

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.tarimatwasi: DEBUG
