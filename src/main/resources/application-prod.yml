# Perfil prod (SPRING_PROFILES_ACTIVE=prod, despliegue desde main): estricto. Sin defaults: si
# falta una variable, el arranque falla en vez de correr con valores de desarrollo
# (BE-SPR-CFG-05). La documentación de la API está apagada.
server:
  port: ${PORT}
  forward-headers-strategy: native # el proxy termina TLS; respeta X-Forwarded-*

spring:
  datasource:
    url: ${DATABASE_URL}

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN} # origin exacto del frontend, https, sin "/" final
  # Primer ADMIN (AdminBootstrap): solo se crea si no existe ninguno. Son las únicas variables
  # opcionales con valor vacío por defecto: una vez creado el ADMIN ya no hacen falta.
  admin:
    required: true # sin ADMIN y sin ADMIN_DOCUMENT_NUMBER / ADMIN_EMAIL el arranque falla
    document-number: ${ADMIN_DOCUMENT_NUMBER:}
    email: ${ADMIN_EMAIL:}
  r2:
    account-id: ${R2_ACCOUNT_ID}
    access-key-id: ${R2_ACCESS_KEY_ID}
    secret-access-key: ${R2_SECRET_ACCESS_KEY}
    endpoint: ${R2_ENDPOINT}
    bucket-name: ${R2_BUCKET_NAME}
  resend:
    api-key: ${RESEND_API_KEY}
    from-email: ${RESEND_FROM_EMAIL}

# Métricas y logs por push a Grafana Cloud (ADR-F5, TAR-139). Spring Boot lee
# OTEL_EXPORTER_OTLP_HEADERS solo (spring-boot-opentelemetry); la del endpoint es obligatoria como el
# resto. Los logs por debajo de INFO no salen (logback-spring.xml).
management:
  otlp:
    metrics:
      export:
        enabled: true
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/metrics
  logging:
    export:
      otlp:
        enabled: true
  opentelemetry:
    resource-attributes:
      deployment.environment: prod
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/logs

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    com.tarimatwasi: INFO
