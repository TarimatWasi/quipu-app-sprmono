# Valores solo para pruebas (no son secretos): el secreto JWT nunca tiene valor por defecto en
# src/main/resources, así que las pruebas lo fijan aquí.
app:
  jwt:
    secret: test-secret-test-secret-test-secret-test-secret
  # Las pruebas de integración hacen muchas peticiones desde la misma dirección.
  rate-limit:
    per-minute: 100000
    # y varias subidas seguidas del mismo usuario (TAR-206): el máximo que acepta la validación, sin
    # ráfaga menor. UploadRateLimitBffTest fija su propio límite.
    uploads-per-minute: 60
    upload-burst: 60
    # y varias altas de administrador seguidas (RF-22); AdministratorRateLimitBffTest fija el suyo.
    administrator-creations-per-minute: 60
